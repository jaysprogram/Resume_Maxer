name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes only full release tags (no floating v10 tag).
      - uses: astral-sh/setup-uv@v10.2.0
      # A pinned release verified by checksum, not a piped install script. The
      # version and checksum live in one file, shared with deploy/setup.sh.
      - name: Install Tectonic
        run: |
          set -a; . deploy/tectonic.env; set +a
          curl -fsSL -o tectonic.tar.gz \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TECTONIC_SHA256}  tectonic.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf tectonic.tar.gz -C "$HOME/.local/bin" tectonic
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -rs
