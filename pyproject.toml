[project]
name = "resume-maxer"
version = "0.1.0"
description = "Tailor a resume to a job description and compile a one-page LaTeX PDF."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.17.0",
    "fastapi>=0.156.4",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pydantic>=2.14.0",
    "pypdf>=6.20.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
resume-maxer = "resume_maxer.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
